events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Docker internal DNS resolver (enables dynamic resolution without startup crashes)
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------
    # HTTP Server: Port 80
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name socratic.duckdns.org localhost _;

        client_max_body_size 50M;

        # Certbot ACME webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Grafana Reverse Proxy
        location /grafana/ {
            set $grafana_backend "http://grafana:3000";
            proxy_pass $grafana_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        # Prometheus Reverse Proxy
        location /prometheus/ {
            set $prometheus_backend "http://prometheus:9090";
            proxy_pass $prometheus_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location = /prometheus {
            return 301 /prometheus/;
        }

        # Socratic Tutor Web App (FastAPI)
        location / {
            set $app_backend "http://app:8000";
            proxy_pass $app_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming LLM / WebSocket / SSE support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_buffering off;
        }
    }

    # -------------------------------------------------------------
    # HTTPS Server: Port 443 (SSL Termination)
    # -------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name socratic.duckdns.org localhost;

        ssl_certificate /etc/letsencrypt/live/socratic.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/socratic.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        client_max_body_size 50M;

        # Grafana Reverse Proxy
        location /grafana/ {
            set $grafana_backend "http://grafana:3000";
            proxy_pass $grafana_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        # Prometheus Reverse Proxy
        location /prometheus/ {
            set $prometheus_backend "http://prometheus:9090";
            proxy_pass $prometheus_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
        }

        location = /prometheus {
            return 301 /prometheus/;
        }

        # Socratic Tutor Web App (FastAPI)
        location / {
            set $app_backend "http://app:8000";
            proxy_pass $app_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Streaming LLM / WebSocket / SSE support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_buffering off;
        }
    }
}
