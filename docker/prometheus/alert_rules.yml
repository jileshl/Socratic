groups:
  - name: socratic-tutor
    rules:
      # The one required working alert (L16). A practice-mode reply that gives away
      # the answer breaks the core promise of the tutor, so a burst of them pages.
      # Demo: set OPS_DEMO=1, sign in to the teacher view, then
      #   curl -X POST -b teacher=<cookie> "http://localhost:8000/api/ops/emit-test-leak?count=5"
      # (synthetic leaks carry source="synthetic" so they never mix with real ones in reports).
      - alert: AnswerLeakSpike
        expr: sum(increase(socratic_answer_leaks_total[10m])) > 2
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "More than 2 answer leaks in practice mode in the last 10 minutes"
          description: "Check the output guardrail and the tutor prompt. Leaks by source: {{ $value }}."

      - alert: TutorErrors
        expr: sum(increase(socratic_errors_total[10m])) > 5
        for: 2m
        labels:
          severity: warn
        annotations:
          summary: "The tutor raised more than 5 errors in 10 minutes"

      - alert: DistressAlertWaiting
        expr: increase(socratic_distress_alerts_total[5m]) > 0
        labels:
          severity: page
        annotations:
          summary: "A student showed signs of distress; a teacher needs to check the teacher view now"
