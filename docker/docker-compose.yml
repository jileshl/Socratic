# Everything with one command, from the repository root:
#   docker compose -f docker/docker-compose.yml up      (or: make up)
#
# Unified SSL entrypoint on https://socratic.duckdns.org (via Nginx & Certbot):
#   https://socratic.duckdns.org/               student view
#   https://socratic.duckdns.org/teacher        teacher view (TEACHER_PIN in .env)
#   https://socratic.duckdns.org/grafana/       Grafana dashboard "Socratic Tutor" (admin / admin)
#   https://socratic.duckdns.org/prometheus/    Prometheus (Alerts tab: AnswerLeakSpike)
#
# HTTP (:80) automatically redirects to HTTPS (:443).
#
# Direct service ports (configurable via env vars):
#   http://localhost:8000          student view (app)
#   http://localhost:3000          Grafana
#   http://localhost:9090          Prometheus
#
# Evaluation runs in its own container:
#   docker compose -f docker/docker-compose.yml --profile eval run --rm eval e1_c2 --split dev
#
# Prometheus and Grafana settings are written inline below (configs:), so this
# file is the only Docker configuration. App settings live in socratic_tutor/config.py.
# The four MCP tool servers run as their own services over streamable HTTP (guide p.5: "stdio during development
# and HTTP inside Docker"); the app reaches them by service name (MCP_*_URL below). If one is down, the app uses the
# same server in-process and counts it (socratic_errors_total{where="mcp_http_fallback"}).

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: socratic-tutor:local   # the MCP services below run this same image
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${APP_PORT:-8000}:8000"   # set APP_PORT to use another port on your computer
    environment:
      MCP_TEXTBOOK_KB_URL: http://mcp-textbook:8101/mcp
      MCP_MATH_TOOLS_URL: http://mcp-math:8102/mcp
      MCP_QUESTION_BANK_URL: http://mcp-question-bank:8103/mcp
      MCP_LEARNER_STORE_URL: http://mcp-learner-store:8104/mcp
    volumes:
      - app-index:/app/.index      # NCERT index, vector store, learner store, checkpoints, ops records
      - app-cache:/app/.cache      # scrubbed traces
      - ../evalkit/results/labels:/app/evalkit/results/labels   # "Score conversations": the scores are saved on your machine
    restart: unless-stopped

  # The MCP servers: the same image, one server each, HTTP inside the Compose network only (no ports published).
  # textbook-kb, question-bank and learner-store read the index volume the app builds, so they start once the app
  # is healthy.
  mcp-textbook:
    image: socratic-tutor:local
    pull_policy: never
    command: ["python", "-m", "socratic_tutor.tools.textbook_kb_server", "--http", "8101"]
    environment: {MCP_ALLOWED_HOSTS: "mcp-textbook,localhost,127.0.0.1"}
    env_file: [{path: ../.env, required: false}]
    volumes: [app-index:/app/.index]
    depends_on: {app: {condition: service_healthy}}
    healthcheck: {disable: true}
    restart: unless-stopped

  mcp-math:
    image: socratic-tutor:local
    pull_policy: never
    command: ["python", "-m", "socratic_tutor.tools.math_tools_server", "--http", "8102"]
    environment: {MCP_ALLOWED_HOSTS: "mcp-math,localhost,127.0.0.1"}
    depends_on: [app]
    healthcheck: {disable: true}
    restart: unless-stopped

  mcp-question-bank:
    image: socratic-tutor:local
    pull_policy: never
    command: ["python", "-m", "socratic_tutor.tools.question_bank_server", "--http", "8103"]
    environment: {MCP_ALLOWED_HOSTS: "mcp-question-bank,localhost,127.0.0.1"}
    env_file: [{path: ../.env, required: false}]
    volumes: [app-index:/app/.index]
    depends_on: {app: {condition: service_healthy}}
    healthcheck: {disable: true}
    restart: unless-stopped

  mcp-learner-store:
    image: socratic-tutor:local
    pull_policy: never
    command: ["python", "-m", "socratic_tutor.tools.learner_store_server", "--http", "8104"]
    environment: {MCP_ALLOWED_HOSTS: "mcp-learner-store,localhost,127.0.0.1"}
    volumes: [app-index:/app/.index]
    depends_on: {app: {condition: service_healthy}}
    healthcheck: {disable: true}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.route-prefix=/prometheus"
      - "--web.external-url=/prometheus/"
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
      - source: alert_rules
        target: /etc/prometheus/alert_rules.yml
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [app]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/socratic.json
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/socratic.yml
      - source: grafana_dashboard
        target: /var/lib/grafana/dashboards/socratic.json
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - app
      - grafana
      - prometheus
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  eval:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["eval"]
    entrypoint: ["sh", "-c", "[ -s .index/chunks.json ] || python scripts/build_index.py --force; exec python -m evalkit.runner \"$$@\"", "--"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../evalkit/results:/app/evalkit/results   # run logs and transcripts stay on your machine
      - ../evalkit/held_out:/app/evalkit/held_out:ro   # held-out cases: only this service can read them
      - eval-index:/app/.index

configs:
  prometheus:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      rule_files: [/etc/prometheus/alert_rules.yml]
      scrape_configs:
        - job_name: socratic-app
          metrics_path: /metrics
          static_configs:
            - targets: ["app:8000"]

  alert_rules:
    content: |
      groups:
        - name: socratic-tutor
          rules:
            # The required working alert (L16): a burst of practice-mode answer leaks.
            # Demo: OPS_DEMO=1, sign in to the teacher view, then in the browser console
            #   fetch('/api/ops/emit-test-leak?count=5', {method: 'POST'})
            - alert: AnswerLeakSpike
              expr: sum(increase(socratic_answer_leaks_total[10m])) > 2
              for: 1m
              labels: {severity: page}
              annotations:
                summary: "More than 2 answer leaks in practice mode in the last 10 minutes"
            - alert: TutorErrors
              expr: sum(increase(socratic_errors_total[10m])) > 5
              for: 2m
              labels: {severity: warn}
              annotations:
                summary: "The tutor raised more than 5 errors in 10 minutes"
            # Fires while a distress alert is still open on the teacher page (it used to look only at the last
            # 5 minutes and go quiet by itself even if no teacher had handled it).
            - alert: DistressAlertWaiting
              expr: max(socratic_open_alerts{kind="distress"}) > 0
              labels: {severity: page}
              annotations:
                summary: "A student showed signs of distress; a teacher needs to check the teacher view now"

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus:9090/prometheus", isDefault: true}

  grafana_dashboards:
    content: |
      apiVersion: 1
      providers:
        - {name: socratic, folder: "", type: file, options: {path: /var/lib/grafana/dashboards}}

  grafana_dashboard:
    file: ./grafana-dashboard.json

volumes:
  app-index:
  app-cache:
  eval-index:
  prometheus-data:
  grafana-data:
  certbot-etc:
  certbot-www:
