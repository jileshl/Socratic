[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-tutor"
version = "0.2.0"
description = "NCERT Class 10 Science tutor that teaches, not tells (IIT-Bombay Agentic AI capstone, project 3)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["socratic_tutor*", "evalkit*"]

[tool.setuptools.package-data]
socratic_tutor = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
